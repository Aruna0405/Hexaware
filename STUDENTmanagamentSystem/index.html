<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>

        <div class="form-container">
            <h2>Enter Details</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter student name">
            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="Enter student age">
            <label for="grade">Grade:</label>
            <input type="number" id="grade" placeholder="Enter student grade">
            <button id="addStudentBtn">Add Student</button>
        </div>

        <div class="button-container">
            <button id="viewStudentsBtn">View All Students</button>
            <button id="sortStudentsBtn">Sort by Age</button>
            <button id="deleteStudentBtn">Delete Student</button>
        </div>

        <div class="student-list">
            <h2>Student List</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
